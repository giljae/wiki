name: Deploy Wiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgit2-dev pkg-config

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build static site
        run: bundle exec ruby scripts/build_site.rb
        env:
          BASE_PATH: ""
          SITE_URL: https://wiki.giljae.com
          CUSTOM_DOMAIN: wiki.giljae.com
          GITHUB_REPO: ${{ github.repository }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://wiki.giljae.com
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
