<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><%= page.title %> — Giljae's Digital Garden</title>
  <link rel="stylesheet" href="<%= BASE_PATH %>/assets/style.css">
  <% if File.exist?(File.join(ROOT, 'custom.css')) %>
  <link rel="stylesheet" href="<%= BASE_PATH %>/custom.css">
  <% end %>
</head>
<body>
  <div class="wiki-container">
    <% if sidebar %>
    <aside class="wiki-sidebar">
      <div class="sidebar-content">
        <%= sidebar %>
      </div>
    </aside>
    <% end %>
    <main class="wiki-content">
      <article>
        <h1 class="page-title"><%= page.title %></h1>
        <%= content %>
      </article>
      <% if page.version && page.version.author %>
      <footer class="wiki-footer">
        <small>
          Last edited by <%= page.version.author.name %>,
          <%= page.version.authored_date.strftime('%Y-%m-%d') %>
        </small>
      </footer>
      <% end %>
    </main>
  </div>
</body>
</html>
